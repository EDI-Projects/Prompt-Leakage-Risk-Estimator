[tool.poetry]
name = "prompt-leakage-risk-estimator"
version = "0.1.0"
description = "Prompt Leakage Risk Estimator (PLRE)"
authors = ["samayk27 <samaykumar2712@gmail.com>"]
readme = "README.md"
packages=[
    { include="plre" }
]


[tool.poetry.dependencies]
python = "^3.12"
transformers = "^4.56.1"
pandas = "^2.3.2"
pytest = "^8.4.2"
streamlit = "^1.49.1"
plotly = "^6.5.0"
python-dotenv = "^1.0.0"
click = "^8.0.0"
rich = "^13.0.0"
anthropic = "^0.30.0"
google-generativeai = "^0.8.0"
requests = "^2.31.0"
tqdm = "^4.66.0"


[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

